{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{.Title}} · Velin</title>
	<link rel="icon" href="{{.AdminURLPrefix}}static/velin-icon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="{{.AdminURLPrefix}}static/admin.css">
	<script src="{{.AdminURLPrefix}}static/admin.js" defer></script>
</head>
<body>
	<div class="shell">
		<header>
			<a class="brand" href="{{.AdminURLPrefix}}./" aria-label="Velin dashboard">
				<img class="brand-mark" src="{{.AdminURLPrefix}}static/velin-icon.svg" alt="">
				<span>Velin</span>
			</a>
			{{if .Authenticated}}
			<nav>
				<a href="{{.AdminURLPrefix}}./"{{if eq .ActiveNav "dashboard"}} class="active"{{end}}>Dashboard</a>
				<a href="{{.AdminURLPrefix}}devices"{{if eq .ActiveNav "devices"}} class="active"{{end}}>Devices</a>
				<a href="{{.AdminURLPrefix}}roots"{{if eq .ActiveNav "roots"}} class="active"{{end}}>Library</a>
				<a href="{{.AdminURLPrefix}}search"{{if eq .ActiveNav "search"}} class="active"{{end}}>Search</a>
				<a href="{{.AdminURLPrefix}}pairing"{{if eq .ActiveNav "pairing"}} class="active"{{end}}>Pairing</a>
			</nav>
			<form method="post" action="{{.AdminURLPrefix}}logout" class="inline-form">
				<input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
				<button type="submit">Sign out</button>
			</form>
			{{end}}
		</header>
		<main>
			{{.BodyHTML}}
		</main>
	</div>
</body>
</html>
{{end}}
